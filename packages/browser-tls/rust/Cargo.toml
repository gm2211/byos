[package]
name = "motive-browser-tls"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rustls = { version = "=0.23.45", default-features = false, features = ["std", "ring"] }
rustls-pki-types = { version = "=1.15.1", features = ["web"] }
ring = { version = "=0.17.14", features = ["wasm32_unknown_unknown_js"] }
webpki-roots = "=1.0.9"
wasm-bindgen = "=0.2.128"
js-sys = "=0.3.105"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
