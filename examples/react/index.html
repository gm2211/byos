<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f6f8" />
    <title>BYOS React customization demo</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-synthesis: none; text-rendering: optimizeLegibility; }
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; min-height: 100vh; background: #f5f6f8; color: #202633; }
      button, select { font: inherit; }
      button:focus-visible, select:focus-visible { outline: 2px solid #5369c9; outline-offset: 2px; }
      .demo-app {
        --byos-font: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --byos-font-mono: ui-monospace, SFMono-Regular, Menlo, monospace;
        --byos-text: #202633; --byos-muted: #5f6879; --byos-faint: #778195;
        --byos-surface: #fff; --byos-surface-soft: #f6f7fa; --byos-surface-raised: #edf0f5; --byos-surface-input: #fff;
        --byos-line: #e0e4eb; --byos-line-strong: #c8ceda;
        --byos-accent: #5369c9; --byos-accent-strong: #3c50a8; --byos-on-accent: #fff;
        --byos-success: #287653; --byos-warning: #a46213; --byos-warning-soft: #fbf2e3; --byos-danger: #b64242;
        --byos-radius: 9px; --byos-radius-lg: 15px; --byos-shadow: 0 18px 44px -22px rgb(30 39 61 / 34%);
        min-height: 100vh; color: var(--byos-text); font-family: var(--byos-font);
      }
      .demo-app.theme-moss { --byos-accent: #38715d; --byos-accent-strong: #285746; --byos-success: #287653; --byos-on-accent: #fff; }
      .demo-app.theme-plum { --byos-accent: #7652a2; --byos-accent-strong: #5d3d84; --byos-success: #287653; --byos-on-accent: #fff; }
      .demo-page { width: min(100%, 980px); min-height: 100vh; margin: 0 auto; padding: 0 28px 24px; }
      .masthead { min-height: 76px; display: flex; align-items: center; justify-content: space-between; gap: 20px; border-bottom: 1px solid #e1e4eb; }
      .wordmark { display: flex; align-items: center; gap: 10px; color: #414a5a; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
      .wordmark-mark { width: 24px; height: 24px; display: grid; place-items: center; border: 1px solid #cfd5e2; border-radius: 8px; color: #5369c9; font-size: 11px; letter-spacing: 0; }
      .masthead-note { color: #778195; font-size: 12px; }
      main { padding-top: 22px; }
      .intro { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 17px; }
      .eyebrow { margin: 0 0 5px; color: #68748a; font: 600 10px/1.4 var(--byos-font-mono); letter-spacing: .1em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(21px, 3vw, 28px); line-height: 1.15; font-weight: 620; letter-spacing: -.035em; }
      .intro-copy { max-width: 360px; margin: 0; color: #667084; font-size: 13px; line-height: 1.55; }
      .controls {
        display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 12px;
        margin-bottom: 16px; padding: 12px 14px; border: 1px solid #e1e5ec; border-radius: 12px; background: #ebeef3;
      }
      .control { min-width: 0; display: grid; gap: 5px; }
      .control label { color: #596477; font: 600 10px/1.4 var(--byos-font-mono); letter-spacing: .06em; text-transform: uppercase; }
      .control select { width: 100%; min-height: 44px; padding: 0 9px; border: 1px solid #d0d6e0; border-radius: 8px; background: #fff; color: #252c39; font-size: 12px; }
      .showcase { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(230px, .75fr); gap: 15px; align-items: start; }
      .card { min-width: 0; border: 1px solid #e1e5ec; border-radius: 15px; background: #fff; box-shadow: 0 4px 14px rgb(27 38 63 / 3%); }
      .signin-card { padding: 20px 22px 16px; }
      .card-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
      .card-kicker { margin: 0; color: #707b8f; font: 600 10px/1.4 var(--byos-font-mono); letter-spacing: .08em; text-transform: uppercase; }
      .sample-badge { padding: 4px 7px; border: 1px solid #dce2ef; border-radius: 999px; color: #59667d; font-size: 10px; white-space: nowrap; }
      .settings-card { padding: 18px; }
      .settings-card h2 { margin: 0; font-size: 15px; font-weight: 620; letter-spacing: -.015em; }
      .settings-copy { margin: 6px 0 15px; color: #707b8f; font-size: 12px; line-height: 1.5; }
      .pill-line { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
      .pill-caption { min-width: 0; color: #68748a; font-size: 11px; line-height: 1.4; }
      .demo-popover-title { margin: 0 0 12px; font-size: 13px; font-weight: 650; }
      .demo-popover-footer { display: flex; justify-content: flex-end; margin-top: 13px; }
      .demo-close { min-height: 44px; padding: 0 13px; border: 1px solid #d2d8e3; border-radius: 8px; background: #fff; color: #455065; font-size: 12px; cursor: pointer; }
      .demo-close:hover { background: #f4f6f9; }
      .privacy-note { margin: 14px 0 0; color: #7b8493; font-size: 11px; line-height: 1.45; }
      #byos-overlay-root { position: relative; z-index: 200; }
      footer { padding: 17px 2px 0; color: #8a92a0; font-size: 10px; line-height: 1.5; }
      @media (max-width: 700px) {
        .demo-app { height: 100svh; min-height: 100svh; }
        .demo-page { height: 100svh; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
        .demo-page { padding: 0 16px 14px; }
        .masthead { min-height: 56px; flex: none; }
        .masthead-note { font-size: 10px; }
        main { min-height: 0; flex: 1; overflow-y: auto; overscroll-behavior: contain; padding-top: 16px; }
        .intro { align-items: start; margin-bottom: 12px; }
        .intro-copy { display: none; }
        .controls { position: sticky; top: 0; z-index: 5; max-height: min(152px, 24svh); overflow-y: auto; align-content: start; gap: 8px; margin-bottom: 12px; padding: 9px; background: #ebeef3; }
        .showcase { grid-template-columns: minmax(0, 1fr); gap: 11px; }
        .signin-card { padding: 15px 17px 12px; }
        .settings-card { padding: 13px 16px; }
        .settings-copy { display: none; }
        #byos-overlay-root .byos-pill-popover { position: fixed; z-index: 201; top: auto; right: 0; bottom: 0; left: 0; width: auto; padding-bottom: calc(16px + env(safe-area-inset-bottom)); border-radius: var(--byos-radius-lg) var(--byos-radius-lg) 0 0; }
        #byos-overlay-root .byos-pill-backdrop { z-index: 200; }
        footer { flex: none; padding-top: 10px; }
      }
      @media (max-width: 400px) {
        .demo-page { padding-inline: 12px; }
        .controls { grid-template-columns: 1.2fr .8fr .7fr; gap: 6px; }
        .masthead-note { max-width: 118px; text-align: right; }
        .signin-card { padding-inline: 14px; }
      }
      @media (max-height: 650px) and (max-width: 700px) {
        .masthead { min-height: 48px; }
        main { padding-top: 10px; }
        .intro { margin-bottom: 8px; }
        .controls { margin-bottom: 9px; padding-block: 7px; }
        .signin-card { padding-block: 12px 10px; }
        .card-top { margin-bottom: 9px; }
        .settings-card { padding-block: 10px; }
        footer { padding-top: 7px; }
        .byos-signin { gap: 10px !important; }
        .byos-signin-heading { gap: 5px !important; }
        .byos-signin h3 { font-size: 18px !important; }
        .byos-signin-code { padding-block: 9px !important; }
      }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
