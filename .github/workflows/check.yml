name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - run: npm run check
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.94.1 --profile minimal
      - run: cargo +1.94.1 test --manifest-path packages/browser-tls/rust/Cargo.toml --locked
  mlx-helper:
    # Compiles the Swift helper and its Metal kernels. Hosted runners have no usable GPU for
    # MLX, so generation itself is verified on a real Mac (packages/mlx-local/scripts/smoke.mjs).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: sh packages/mlx-local/scripts/build-bridge.sh
      - run: test -x packages/mlx-local/bin/byos-mlx && test -f packages/mlx-local/bin/mlx.metallib
      - run: echo '{"id":"1","op":"hello"}' | packages/mlx-local/bin/byos-mlx --models-dir "$RUNNER_TEMP/mlx" | grep '"protocol":1'
  swift-core:
    # ByosCore, the Swift side of @byos/core, against the shared conformance vectors.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path packages/core/swift
